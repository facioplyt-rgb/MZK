<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03060b">
    <title>MZK Gorzów - LIVE (UM + MZK API)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --accent: #00d166; --bg: #03060b; --surf: #0d121d; --surf-l: #161d2b; 
            --text: #ffffff; --text-m: #94a3b8; --tram: #ff4757; --bus: #00a8ff; 
            --warn: #f1c40f; --border: rgba(255,255,255,0.06); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        #sync-status { position: fixed; bottom: 0; left: 0; width: 100%; padding: 6px 15px; font-size: 0.7rem; background: var(--surf); border-top: 1px solid var(--border); display: flex; justify-content: space-between; z-index: 5000; color: var(--text-m); font-weight: 600; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        header { padding: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(3,6,11,0.95); backdrop-filter: blur(15px); z-index: 2000; }
        
        .side-menu { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--surf); z-index: 4000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px; border-right: 1px solid var(--border); }
        .side-menu.open { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: none; backdrop-filter: blur(5px); }
        .overlay.show { display: block; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        .card { background: var(--surf); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }
        .module { display: none; }
        .module.active { display: block; animation: fadeIn 0.25s ease-out; }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 0.85rem; animation: slideIn 0.3s forwards; box-shadow: 0 8px 20px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
        .toast.success { background: var(--accent); color: #000; }
        .toast.error { background: var(--tram); color: #fff; }
        
        .delay-tag { font-size: 0.7rem; font-weight: 900; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
        .delay-tag.on-time { background: rgba(0, 209, 102, 0.15); color: var(--accent); }
        .delay-tag.delayed { background: rgba(255, 71, 87, 0.15); color: var(--tram); }
        .delay-tag.early { background: rgba(0, 168, 255, 0.15); color: var(--bus); }

        .skeleton { background: linear-gradient(90deg, var(--surf-l) 25%, #1e293b 50%, var(--surf-l) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 12px; height: 50px; margin-bottom: 10px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        input, select { width: 100%; padding: 14px; border-radius: 12px; background: var(--surf-l); border: 1px solid var(--border); color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; padding: 14px; border: none; border-radius: 12px; width: 100%; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-sm { padding: 8px 12px; font-size: 0.75rem; width: auto; background: var(--surf-l); color: #fff; border: 1px solid var(--border); border-radius: 8px; }

        .nav-item { padding: 14px; display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; border-radius: 12px; margin-bottom: 6px; }
        .nav-item:hover { background: var(--surf-l); color: var(--accent); }
        
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 900; }
        .dep-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--surf-l); border-radius: 10px; margin-bottom: 6px; border: 1px solid var(--border); }
        .news-card { border-left: 4px solid var(--warn); background: var(--surf); padding: 14px; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="sync-status">
    <span><span id="status-dot" class="status-dot" style="background: #f1c40f;"></span> <span id="status-text">Łączenie z API UM & MZK...</span></span>
    <span>HYBRID LIVE API</span>
</div>

<div class="overlay" id="overlay" onclick="App.toggleMenu(false)"></div>

<div class="side-menu" id="side-menu">
    <h2 style="font-weight: 900; margin-bottom: 30px;">MZK <span style="color:var(--accent)">GORZÓW</span></h2>
    <div class="nav-item" onclick="App.gate('vehicles')"><i class="fa-solid fa-bus"></i> Pojazdy Live (UM)</div>
    <div class="nav-item" onclick="App.gate('lines')"><i class="fa-solid fa-route"></i> Linie i Rozkłady</div>
    <div class="nav-item" onclick="App.gate('stops')"><i class="fa-solid fa-location-dot"></i> Przystanki</div>
    <div class="nav-item" onclick="App.gate('news')"><i class="fa-solid fa-newspaper"></i> Komunikaty MZK</div>
    <div class="nav-item" onclick="App.gate('alerts')"><i class="fa-solid fa-bullhorn"></i> Zgłoszenia</div>
</div>

<header>
    <div onclick="App.toggleMenu(true)" style="font-size: 1.4rem; cursor: pointer; color: var(--accent);"><i class="fa-solid fa-bars-staggered"></i></div>
    <div style="font-weight: 900; letter-spacing: 1px; color: var(--accent);">MZK GORZÓW LIVE</div>
    <div id="live-clock" style="font-weight: 700; font-size: 0.85rem; background: var(--surf-l); padding: 4px 10px; border-radius: 8px;">00:00:00</div>
</header>

<div class="container">
    <!-- POJAZDY LIVE -->
    <section id="mod-vehicles" class="module active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="font-weight: 900;">POJAZDY NA ŻYWO</h2>
            <button class="btn btn-sm" onclick="ModVehicles.load()"><i class="fa-solid fa-rotate"></i> Odśwież</button>
        </div>
        <div id="vehicles-list"></div>
    </section>

    <!-- LINIE -->
    <section id="mod-lines" class="module">
        <h2 style="margin-bottom:15px; font-weight: 900;">LINIE I TRASY</h2>
        <div id="lines-list"></div>
    </section>

    <!-- PRZYSTANKI -->
    <section id="mod-stops" class="module">
        <h2 style="margin-bottom:15px; font-weight: 900;">SZUKAJ PRZYSTANKU</h2>
        <input type="text" id="stop-search" placeholder="Wpisz nazwę przystanku..." oninput="ModStops.filter(this.value)">
        <div id="stops-list"></div>
    </section>

    <!-- KOMUNIKATY MZK -->
    <section id="mod-news" class="module">
        <h2 style="margin-bottom:15px; font-weight: 900;">OSTATNIE KOMUNIKATY MZK</h2>
        <div id="news-list"></div>
    </section>

    <!-- ALERTY (FIREBASE) -->
    <section id="mod-alerts" class="module">
        <h2 style="margin-bottom:15px; font-weight: 900;">ZGŁOSZENIA PASAŻERÓW</h2>
        <button class="btn" style="margin-bottom:15px;" onclick="ModAlerts.openForm()"><i class="fa-solid fa-plus"></i> Dodaj zgłoszenie</button>
        <div id="alerts-list"></div>
    </section>

    <!-- WIDOK SZCZEGÓŁOWY -->
    <section id="mod-details" class="module"></section>
</div>

<script>
const CONFIG = {
    UM_API: "https://komunikacja.um.gorzow.pl/vm/main?command=planner",
    MZK_NEWS_API: "https://mzk-gorzow.pl/index.php?option=com_content&view=category&id=2&format=json",
    TOKEN: "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9"
};

async function fetchProxy(url, headers = {}) {
    const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
    try {
        const res = await fetch(proxyUrl, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    } catch (err) {
        const backupProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const res2 = await fetch(backupProxy, { headers });
        return await res2.json();
    }
}

const App = {
    dbKey: 'mzk_live_alerts',
    cache: { vehicles: [], lines: [], stops: [], news: [] },

    async init() {
        this.startClock();
        this.setupFirebase();
        await this.loadAllAPIData();
    },

    setupFirebase() {
        const firebaseConfig = {
            apiKey: "AIzaSyDAp3b1eLuZdus48M5aE9N9TTzPhFRU4i0",
            authDomain: "mzkfacio.firebaseapp.com",
            databaseURL: "https://mzkfacio-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mzkfacio"
        };
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        this.db = firebase.database();
        
        this.db.ref(this.dbKey).on('value', snap => {
            ModAlerts.render(snap.val() || {});
        });
    },

    async loadAllAPIData() {
        this.status("Pobieranie danych z obu API (UM + MZK)...", "#f1c40f");
        
        try {
            const headers = { "Authorization": `Bearer ${CONFIG.TOKEN}` };
            const [vehicles, lines, stops, news] = await Promise.all([
                fetchProxy(`${CONFIG.UM_API}&action=v`, headers).catch(() => []),
                fetchProxy(`${CONFIG.UM_API}&action=l`, headers).catch(() => []),
                fetchProxy(`${CONFIG.UM_API}&action=p`, headers).catch(() => []),
                fetchProxy(CONFIG.MZK_NEWS_API).catch(() => [])
            ]);

            this.cache.vehicles = Array.isArray(vehicles) ? vehicles : [];
            this.cache.lines = Array.isArray(lines) ? lines : [];
            this.cache.stops = Array.isArray(stops) ? stops : [];
            this.cache.news = Array.isArray(news) ? news : [];

            ModVehicles.render();
            ModLines.render();
            ModStops.render();
            ModNews.render();

            this.status("Połączono z API UM & MZK", "#00d166");
            this.toast("Zaktualizowano dane z obu źródeł!");
        } catch (err) {
            console.error(err);
            this.status("Błąd pobierania danych", "#ff4757");
            this.toast("Błąd aktualizacji z API", "error");
        }
    },

    startClock() {
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('pl-PL');
        }, 1000);
    },

    status(txt, col) {
        document.getElementById('status-text').innerText = txt;
        document.getElementById('status-dot').style.background = col;
    },

    toast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i> ${msg}`;
        container.appendChild(el);
        setTimeout(() => { el.remove(); }, 3000);
    },

    toggleMenu(open) {
        document.getElementById('side-menu').classList.toggle('open', open);
        document.getElementById('overlay').classList.toggle('show', open);
    },

    gate(id) {
        document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
        const target = document.getElementById('mod-' + id) || document.getElementById('mod-vehicles');
        target.classList.add('active');
        this.toggleMenu(false);
        window.scrollTo(0,0);
    }
};

const ModVehicles = {
    async load() {
        App.status("Odświeżanie pojazdów...", "#f1c40f");
        try {
            const data = await fetchProxy(`${CONFIG.UM_API}&action=v`, { "Authorization": `Bearer ${CONFIG.TOKEN}` });
            App.cache.vehicles = Array.isArray(data) ? data : [];
            this.render();
            App.status("Połączono z API UM & MZK", "#00d166");
            App.toast("Pojazdy odświeżone!");
        } catch(e) {
            App.toast("Błąd odświeżania pojazdów", "error");
        }
    },

    render() {
        const box = document.getElementById('vehicles-list');
        box.innerHTML = '';

        if (!App.cache.vehicles.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Brak aktywnych pojazdów na trasie.</div>';
            return;
        }

        App.cache.vehicles.forEach(v => {
            const isTram = v.linetype === "0" || v.type === "tram";
            const lineLabel = v.lineLabel || v.label || v.line || "N/A";
            const delay = v.delayInMinutes || 0;

            let delayBadge = delay > 0 
                ? `<span class="delay-tag delayed"><i class="fa-solid fa-clock"></i> +${delay} min</span>`
                : (delay < 0 ? `<span class="delay-tag early">${delay} min</span>` : `<span class="delay-tag on-time"><i class="fa-solid fa-check"></i> O czasie</span>`);

            box.innerHTML += `
                <div class="card" style="border-left: 4px solid ${isTram ? 'var(--tram)' : 'var(--bus)'}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <div>
                            <span class="badge" style="background:${isTram ? 'var(--tram)' : 'var(--bus)'}; color:#fff;">
                                ${lineLabel}
                            </span>
                            <b style="margin-left:8px;">Pojazd #${v.id || 'LIVE'}</b>
                        </div>
                        ${delayBadge}
                    </div>
                    <div style="font-size:0.8rem; opacity:0.75; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-location-arrow"></i> Kierunek: ${v.headsign || 'Trasa Miejscka'}</span>
                        <span style="font-family:monospace; color:var(--accent);">${v.lat ? parseFloat(v.lat).toFixed(3) : '---'}, ${v.lon ? parseFloat(v.lon).toFixed(3) : '---'}</span>
                    </div>
                </div>`;
        });
    }
};

const ModLines = {
    render() {
        const box = document.getElementById('lines-list');
        box.innerHTML = '';

        let lines = App.cache.lines;
        if (!lines.length && App.cache.vehicles.length) {
            const extracted = [...new Set(App.cache.vehicles.map(v => v.lineLabel || v.line))].filter(Boolean);
            lines = extracted.map(id => ({ id, name: `Linia ${id}` }));
        }

        if (!lines.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Pobieranie listy linii...</div>';
            return;
        }

        lines.forEach(l => {
            const lineId = l.id || l.name;
            box.innerHTML += `
                <div class="card" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="ModLines.showDetails('${lineId}')">
                    <div>
                        <span class="badge" style="background:var(--accent); color:#000; font-size:0.9rem; margin-right:10px;">${lineId}</span>
                        <b>${l.name || 'Linia ' + lineId}</b>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="opacity:0.4;"></i>
                </div>`;
        });
    },

    async showDetails(lineId) {
        document.getElementById('mod-details').innerHTML = '<div class="skeleton"></div>';
        App.gate('details');

        const activeVehicles = App.cache.vehicles.filter(v => (v.lineLabel || v.line) === lineId);

        let activeHtml = activeVehicles.map(v => `
            <div class="dep-item">
                <div><b>Pojazd #${v.id || 'LIVE'}</b> → ${v.headsign || 'W trasie'}</div>
                <div style="color:var(--accent); font-weight:bold;">${v.delayInMinutes ? '+' + v.delayInMinutes + ' min' : 'O czasie'}</div>
            </div>
        `).join('') || '<p style="opacity:0.5; font-size:0.85rem; padding:10px;">Brak aktywnych pojazdów na tej linii w tej chwili.</p>';

        document.getElementById('mod-details').innerHTML = `
            <button class="btn btn-sm" onclick="App.gate('lines')" style="margin-bottom:15px;"><i class="fa-solid fa-arrow-left"></i> POWRÓT</button>
            <div class="card">
                <h1 style="font-size:2.5rem; color:var(--accent); margin-bottom:5px;">Linia ${lineId}</h1>
                <p style="opacity:0.6; margin-bottom:15px;">Dane połączone z API Gorzów</p>
                <h3 style="margin-bottom:10px;">POJAZDY NA TRASIE (${activeVehicles.length}):</h3>
                ${activeHtml}
            </div>`;
    }
};

const ModStops = {
    render() {
        this.filter('');
    },

    filter(query) {
        const box = document.getElementById('stops-list');
        box.innerHTML = '';
        
        let stops = App.cache.stops;

        if (!stops.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Brak danych przystankowych.</div>';
            return;
        }

        const filtered = stops.filter(s => (s.name || s.title || '').toLowerCase().includes(query.toLowerCase())).slice(0, 30);

        filtered.forEach(s => {
            box.innerHTML += `
                <div class="card" style="cursor:pointer;" onclick="ModStops.showDepartures('${s.id}', '${s.name || s.title}')">
                    <i class="fa-solid fa-location-dot" style="color:var(--accent); margin-right:8px;"></i>
                    <b>${s.name || s.title}</b>
                </div>`;
        });
    },

    async showDepartures(stopId, stopName) {
        document.getElementById('mod-details').innerHTML = '<div class="skeleton"></div>';
        App.gate('details');

        try {
            const deps = await fetchProxy(`${CONFIG.UM_API}&action=b&stopId=${stopId}`, { "Authorization": `Bearer ${CONFIG.TOKEN}` });
            const depList = Array.isArray(deps) ? deps : [];

            let listHtml = depList.map(d => `
                <div class="dep-item">
                    <div>
                        <span class="badge" style="background:var(--accent); color:#000;">${d.line || d.lineLabel}</span>
                        <b style="margin-left:8px;">${d.headsign || d.direction}</b>
                    </div>
                    <div style="font-weight:900; color:var(--accent);">${d.time || d.actualTime || 'N/A'}</div>
                </div>
            `).join('') || '<p style="opacity:0.5; padding:10px;">Brak najbliższych odjazdów.</p>';

            document.getElementById('mod-details').innerHTML = `
                <button class="btn btn-sm" onclick="App.gate('stops')" style="margin-bottom:15px;"><i class="fa-solid fa-arrow-left"></i> POWRÓT</button>
                <div class="card">
                    <h2 style="color:var(--accent); margin-bottom:5px;">${stopName}</h2>
                    <p style="opacity:0.5; margin-bottom:15px;">Odjazdy w czasie rzeczywistym:</p>
                    ${listHtml}
                </div>`;
        } catch(e) {
            App.toast("Błąd pobierania tablicy odjazdów", "error");
        }
    }
};

const ModNews = {
    render() {
        const box = document.getElementById('news-list');
        box.innerHTML = '';

        if (!App.cache.news.length) {
            box.innerHTML = `
                <div class="news-card">
                    <b>Oficjalne komunikaty MZK Gorzów</b>
                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">Rozkłady jazdy i zmiany tras są aktualizowane automatycznie przez serwer MZK Gorzów.</p>
                </div>`;
            return;
        }

        App.cache.news.forEach(n => {
            box.innerHTML += `
                <div class="news-card">
                    <b>${n.title || 'Komunikat MZK'}</b>
                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">${n.introtext || n.description || 'Brak opisu.'}</p>
                </div>`;
        });
    }
};

const ModAlerts = {
    render(data) {
        const box = document.getElementById('alerts-list');
        box.innerHTML = '';
        const items = Object.values(data || {}).reverse();

        if(!items.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.5;">Brak opublikowanych zgłoszeń.</div>';
            return;
        }

        items.forEach(a => {
            box.innerHTML += `
                <div class="card" style="border-left:4px solid var(--warn);">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${a.type} - Linia ${a.line}</b>
                        <small style="opacity:0.5;">${new Date(a.time).toLocaleTimeString('pl-PL')}</small>
                    </div>
                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">${a.desc}</p>
                </div>`;
        });
    },

    openForm() {
        document.getElementById('mod-details').innerHTML = `
            <button class="btn btn-sm" onclick="App.gate('alerts')" style="margin-bottom:15px;"><i class="fa-solid fa-arrow-left"></i> ANULUJ</button>
            <div class="card">
                <h3 style="margin-bottom:15px;">DODAJ ZGŁOSZENIE PASAŻERA</h3>
                <input id="a-line" placeholder="Numer linii (np. 1, 101)">
                <select id="a-type">
                    <option value="AWARIA">Awaria / Utrudnienia</option>
                    <option value="KANAR">Kontrola biletów</option>
                    <option value="KOREK">Opóźnienie / Korek</option>
                </select>
                <input id="a-desc" placeholder="Opis sytuacji / lokalizacja...">
                <button class="btn" onclick="ModAlerts.save()">WYŚLIJ ZGŁOSZENIE</button>
            </div>`;
        App.gate('details');
    },

    save() {
        const line = document.getElementById('a-line').value;
        const type = document.getElementById('a-type').value;
        const desc = document.getElementById('a-desc').value;

        if(!line || !desc) return App.toast("Wypełnij formularz!", "error");

        App.db.ref(App.dbKey).push({
            line, type, desc, time: Date.now()
        }).then(() => {
            App.toast("Dodano zgłoszenie!");
            App.gate('alerts');
        });
    }
};

App.init();
