
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów Wlkp. - Rozkład Jazdy</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --gray-light: #f4f4f4;
            --gray-border: #b0b0b0;
            --gray-dark: #333333;
            --danger: #cc0000;
            --success: #006600;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.35; }

        header {
            background: var(--gray-dark);
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
        }

        .logo-title { font-weight: bold; font-size: 1rem; text-transform: uppercase; }
        .clock { font-size: 0.9rem; font-weight: bold; }

        nav {
            display: flex;
            background: var(--gray-light);
            border-bottom: 1px solid var(--gray-border);
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid var(--gray-border);
            padding: 10px 5px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            color: var(--gray-dark);
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; border-bottom: 2px solid #000; }

        .container { max-width: 750px; margin: 0 auto; padding: 10px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--gray-border);
            border-radius: 0;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #000; }

        .row-item {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .row-item:hover { background: var(--gray-light); }

        .badge {
            display: inline-block;
            border: 1px solid #000;
            padding: 2px 5px;
            font-weight: bold;
            font-size: 0.75rem;
            min-width: 30px;
            text-align: center;
            background: #fff;
            color: #000;
        }

        .back-btn {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }
        .back-btn:hover { background: #e0e0e0; }

        .dep-row {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-box { text-align: right; }
        .time-main { font-weight: bold; font-size: 1rem; }
        .delay-info { font-size: 0.7rem; font-weight: bold; }
        .delay-info.late { color: var(--danger); }
        .delay-info.on-time { color: var(--success); }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--gray-light);
            border-top: 1px solid var(--gray-border);
            padding: 5px 10px;
            font-size: 0.7rem;
            color: var(--gray-dark);
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .msg-box { text-align: center; padding: 20px; color: #555; }
    </style>
</head>
<body>

<header>
    <div class="logo-title">MZK Gorzów Wlkp. – Rozkład Jazdy</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('stops')">Przystanki</button>
    <button class="nav-btn" onclick="switchTab('lines')">Linie</button>
    <button class="nav-btn" onclick="switchTab('live')">GPS Na Żywo</button>
</nav>

<div class="container" style="padding-bottom: 40px;">
    <!-- PRZYSTANKI -->
    <section id="sec-stops" class="section active">
        <input type="text" id="stop-search" placeholder="Wpisz nazwę przystanku..." oninput="filterStops(this.value)">
        <div id="stops-list" class="msg-box">Pobieranie listy przystanków...</div>
    </section>

    <!-- LINIE -->
    <section id="sec-lines" class="section">
        <div id="lines-list" class="msg-box">Pobieranie listy linii...</div>
    </section>

    <!-- POJAZDY GPS -->
    <section id="sec-live" class="section">
        <div id="live-list" class="msg-box">Pobieranie pozycji pojazdów...</div>
    </section>

    <!-- SZCZEGÓŁY ODJAZDÓW -->
    <section id="sec-details" class="section">
        <button class="back-btn" onclick="switchTab(window.lastTab || 'stops')">&larr; Powrót</button>
        <div id="details-content"></div>
    </section>
</div>

<div class="status-bar">
    <span id="status-text">Łączenie z serwerem miejskim...</span>
    <span id="api-status">API UM Gorzów</span>
</div>

<script>
const PROXY = "https://corsproxy.io/?";
const API_URL = "https://komunikacja.um.gorzow.pl/vm/main?command=planner";
const TOKEN = "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9";

// Globalny stan aplikacji zamknięty w jednym obiekcie unikającym konfliktów nazw
window.appState = {
    stops: [],
    lines: [],
    vehicles: [],
    lastTab: 'stops'
};

async function fetchAPI(action, params = '') {
    const targetUrl = `${API_URL}&action=${action}&token=${TOKEN}${params}`;
    try {
        const res = await fetch(PROXY + encodeURIComponent(targetUrl));
        if (!res.ok) return null;
        const text = await res.text();
        if (text.trim().startsWith('<') || text.includes('Cloudflare') || text.includes('Access Denied')) {
            return null;
        }
        return JSON.parse(text);
    } catch (e) {
        console.error("Błąd zapytania API:", e);
        return null;
    }
}

async function initApp() {
    startClock();
    document.getElementById('status-text').innerText = 'Pobieranie danych z systemu...';

    const [stopsData, linesData, vehiclesData] = await Promise.all([
        fetchAPI('p'),
        fetchAPI('l'),
        fetchAPI('v')
    ]);

    window.appState.stops = Array.isArray(stopsData) ? stopsData : (stopsData?.stops || []);
    window.appState.lines = Array.isArray(linesData) ? linesData : (linesData?.lines || []);
    window.appState.vehicles = Array.isArray(vehiclesData) ? vehiclesData : (vehiclesData?.vehicles || []);

    renderStops();
    renderLines();
    renderLive();

    document.getElementById('status-text').innerText = 'Gotowy';
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function switchTab(tab) {
    if (tab !== 'details') window.appState.lastTab = tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetSec = document.getElementById(`sec-${tab}`);
    if (targetSec) targetSec.classList.add('active');

    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
    }
}

function renderStops() {
    filterStops('');
}

function filterStops(query) {
    const box = document.getElementById('stops-list');
    if (!window.appState.stops.length) {
        box.innerHTML = '<div class="msg-box">Brak danych przystanków. Sprawdź połączenie z siecią.</div>';
        return;
    }

    const filtered = window.appState.stops
        .filter(s => (s.name || s.title || '').toLowerCase().includes(query.toLowerCase()));

    if (!filtered.length) {
        box.innerHTML = '<div class="msg-box">Nie znaleziono przystanku.</div>';
        return;
    }

    box.innerHTML = filtered.map(s => `
        <div class="row-item" onclick="loadStopDepartures('${s.id}', '${s.name || s.title}')">
            <div><strong>${s.name || s.title}</strong></div>
            <div style="font-size: 0.75rem; color: #555;">odjazdy &rarr;</div>
        </div>
    `).join('');
}

async function loadStopDepartures(stopId, stopName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    box.innerHTML = `<div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px;">${stopName}</div><div class="msg-box">Pobieranie rozkładu jazdy na żywo...</div>`;

    const data = await fetchAPI('b', `&stopId=${stopId}`);
    const departures = Array.isArray(data) ? data : (data?.departures || []);

    if (!departures.length) {
        box.innerHTML = `<div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${stopName}</div><div class="msg-box">Brak najbliższych odjazdów dla tego przystanku.</div>`;
        return;
    }

    box.innerHTML = `
        <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${stopName}</div>
        <div style="font-size: 0.75rem; color: #555; margin-bottom: 8px;">Najbliższe odjazdy uwzględniające opóźnienia GPS:</div>
        <div>
            ${departures.map(d => {
                const line = d.line || d.lineLabel || 'MZK';
                const headsign = d.headsign || d.direction || 'Kierunek miejski';
                const time = d.time || d.actualTime || '---';
                const delay = parseInt(d.delayInMinutes || 0, 10);

                let delayHtml = `<div class="delay-info on-time">O czasie</div>`;
                if (delay > 0) {
                    delayHtml = `<div class="delay-info late">+${delay} min opóźnienia</div>`;
                } else if (delay < 0) {
                    delayHtml = `<div class="delay-info on-time">${Math.abs(delay)} min przed czasem</div>`;
                }

                return `
                    <div class="dep-row">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="badge">${line}</span>
                            <div><strong>${headsign}</strong></div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${time}</div>
                            ${delayHtml}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!window.appState.lines.length) {
        box.innerHTML = '<div class="msg-box">Brak danych o liniach.</div>';
        return;
    }

    box.innerHTML = window.appState.lines.map(l => {
        const id = l.id || l.name;
        const name = l.name || `Linia ${id}`;
        return `
            <div class="row-item" onclick="loadLineRoute('${id}', '${name}')">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="badge">${id}</span>
                    <strong>${name}</strong>
                </div>
                <div style="font-size: 0.75rem; color: #555;">pojazdy &rarr;</div>
            </div>
        `;
    }).join('');
}

function loadLineRoute(lineId, lineName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    
    const activeVehicles = window.appState.vehicles.filter(v => (v.lineLabel || v.line) === lineId);

    box.innerHTML = `
        <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${lineName}</div>
        <div style="font-size: 0.75rem; color: #555; margin-bottom: 8px;">Aktualna lokalizacja pojazdów na linii:</div>
        <div>
            ${activeVehicles.length ? activeVehicles.map(v => {
                const delay = parseInt(v.delayInMinutes || 0, 10);
                return `
                    <div class="dep-row">
                        <div>
                            <strong>Pojazd #${v.id || 'N/A'}</strong>
                            <div style="font-size: 0.75rem; color: #555;">Kierunek: ${v.headsign || '---'}</div>
                        </div>
                        <div class="time-box">
                            ${delay > 0 ? `<div class="delay-info late">+${delay} min opóźnienia</div>` : `<div class="delay-info on-time">O czasie</div>`}
                        </div>
                    </div>
                `;
            }).join('') : '<div class="msg-box">Brak aktywnych pojazdów na tej linii w bazie GPS.</div>'}
        </div>
    `;
}

function renderLive() {
    const box = document.getElementById('live-list');
    if (!window.appState.vehicles.length) {
        box.innerHTML = '<div class="msg-box">Brak danych GPS dla pojazdów.</div>';
        return;
    }

    box.innerHTML = window.appState.vehicles.map(v => {
        const line = v.lineLabel || v.line || '?';
        const delay = parseInt(v.delayInMinutes || 0, 10);

        return `
            <div class="dep-row">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="badge">${line}</span>
                    <div>
                        <strong>Kierunek: ${v.headsign || 'Trasa miejska'}</strong>
                        <div style="font-size: 0.7rem; color: #555;">Pojazd #${v.id}</div>
                    </div>
                </div>
                <div class="time-box">
                    ${delay > 0 ? `<div class="delay-info late">+${delay} min</div>` : `<div class="delay-info on-time">O czasie</div>`}
                </div>
            </div>
        `;
    }).join('');
}

// Uruchomienie aplikacji po załadowaniu DOM
document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
