<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów - Rozkład Jazdy</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --text-muted: #666666;
            --border: #cccccc;
            --border-light: #eeeeee;
            --hover: #f5f5f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.4; }

        header {
            border-bottom: 2px solid var(--text);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .clock { font-size: 0.9rem; color: var(--text-muted); font-weight: bold; }

        nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 45px;
            z-index: 90;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
        }

        .nav-btn.active { color: var(--text); border-bottom-color: var(--text); background: var(--hover); }

        .container { max-width: 800px; margin: 0 auto; padding: 12px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 0;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--text); }

        .list-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .list-item:hover { background: var(--hover); }

        .badge {
            display: inline-block;
            border: 1px solid var(--text);
            padding: 2px 6px;
            font-weight: bold;
            font-size: 0.8rem;
            min-width: 32px;
            text-align: center;
            background: #fff;
            color: #000;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--text);
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
        .back-btn:hover { background: var(--text); color: #fff; }

        .departure-row {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-box { text-align: right; }
        .time-main { font-weight: bold; font-size: 1.05rem; }
        .delay-info { font-size: 0.75rem; font-weight: bold; margin-top: 2px; }
        .delay-info.late { color: #d32f2f; }
        .delay-info.on-time { color: #2e7d32; }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .loading { text-align: center; padding: 20px; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

<header>
    <div class="logo">MZK Gorzów Wlkp.</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('stops')">Przystanki</button>
    <button class="nav-btn" onclick="switchTab('lines')">Linie</button>
    <button class="nav-btn" onclick="switchTab('live')">GPS Na Żywo</button>
</nav>

<div class="container" style="padding-bottom: 50px;">
    <!-- PRZYSTANKI -->
    <section id="sec-stops" class="section active">
        <input type="text" id="stop-search" placeholder="Szukaj przystanku..." oninput="filterStops(this.value)">
        <div id="stops-list" class="loading">Ładowanie przystanków...</div>
    </section>

    <!-- LINIE -->
    <section id="sec-lines" class="section">
        <div id="lines-list" class="loading">Ładowanie linii...</div>
    </section>

    <!-- GPS NA ŻYWO -->
    <section id="sec-live" class="section">
        <div id="live-list" class="loading">Ładowanie pozycji pojazdów...</div>
    </section>

    <!-- SZCZEGÓŁY / ODJAZDY Z PRZYSTANKU -->
    <section id="sec-details" class="section">
        <button class="back-btn" onclick="switchTab(lastTab)">&larr; Wróć</button>
        <div id="details-content"></div>
    </section>
</div>

<div class="status-bar">
    <span id="status-text">Inicjalizacja systemu...</span>
    <span>API UM Gorzów</span>
</div>

<script>
// Używamy darmowego, publicznego proxy CORS, które nie blokuje zapytań
const PROXY = "https://corsproxy.io/?"; 
// Ewentualna alternatywa, gdyby corsproxy nie działało: "https://api.allorigins.win/raw?url="

const API_URL = "https://komunikacja.um.gorzow.pl/vm/main?command=planner";
const TOKEN = "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9";

let cache = { stops: [], lines: [], vehicles: [] };
let lastTab = 'stops';

async function fetchAPI(action, params = '') {
    const targetUrl = `${API_URL}&action=${action}&token=${TOKEN}${params}`;
    try {
        // Doklejamy adres URL bezpośrednio do proxy
        const res = await fetch(PROXY + encodeURIComponent(targetUrl));
        if (!res.ok) return null;
        
        const text = await res.text();
        if (text.trim().startsWith('<') || text.includes('Cloudflare') || text.includes('Access Denied')) {
            console.error("Serwer zwrócił stronę HTML/błąd zamiast JSON:", text.substring(0, 100));
            return null;
        }
        return JSON.parse(text);
    } catch (e) {
        console.error("Błąd zapytania API:", e);
        return null;
    }
}


let cache = { stops: [], lines: [], vehicles: [] };
let lastTab = 'stops';

async function fetchAPI(action, params = '') {
    const targetUrl = `${API_URL}&action=${action}&token=${TOKEN}${params}`;
    try {
        const res = await fetch(`${PROXY}/?url=${encodeURIComponent(targetUrl)}`);
        if (!res.ok) return null;
        return await res.json();
    } catch (e) {
        console.error("Błąd API:", e);
        return null;
    }
}

async function init() {
    startClock();
    document.getElementById('status-text').innerText = 'Pobieranie danych z MZK...';

    const [stopsData, linesData, vehiclesData] = await Promise.all([
        fetchAPI('p'),
        fetchAPI('l'),
        fetchAPI('v')
    ]);

    cache.stops = stopsData?.stops || stopsData || [];
    cache.lines = linesData?.lines || linesData || [];
    cache.vehicles = vehiclesData?.vehicles || vehiclesData || [];

    renderStops();
    renderLines();
    renderLive();

    document.getElementById('status-text').innerText = 'Dane zsynchronizované';
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function switchTab(tab) {
    if (tab !== 'details') lastTab = tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(`sec-${tab}`).classList.add('active');
    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
    }
}

function renderStops() {
    filterStops('');
}

function filterStops(query) {
    const box = document.getElementById('stops-list');
    const filtered = cache.stops
        .filter(s => (s.name || s.title || '').toLowerCase().includes(query.toLowerCase()));

    if (!filtered.length) {
        box.innerHTML = '<div class="loading">Brak przystanków spełniających kryteria.</div>';
        return;
    }

    box.innerHTML = filtered.map(s => `
        <div class="list-item" onclick="loadStopDepartures('${s.id}', '${s.name || s.title}')">
            <div><strong>${s.name || s.title}</strong></div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Wybierz &rarr;</div>
        </div>
    `).join('');
}

async function loadStopDepartures(stopId, stopName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    box.innerHTML = `<h2>${stopName}</h2><div class="loading">Pobieranie odjazdów na żywo...</div>`;

    const data = await fetchAPI('b', `&stopId=${stopId}`);
    const departures = data?.departures || data || [];

    if (!departures.length) {
        box.innerHTML = `<h2>${stopName}</h2><div class="loading">Brak aktualnych odjazdów dla tego przystanku.</div>`;
        return;
    }

    box.innerHTML = `
        <h2 style="margin-bottom: 4px; font-size: 1.1rem;">${stopName}</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Najbliższe odjazdy i opóźnienia</p>
        <div>
            ${departures.map(d => {
                const line = d.line || d.lineLabel || 'MZK';
                const headsign = d.headsign || d.direction || 'Kierunek miejski';
                const time = d.time || d.actualTime || '---';
                const delay = parseInt(d.delayInMinutes || 0, 10);

                let delayHtml = `<div class="delay-info on-time">O czasie</div>`;
                if (delay > 0) {
                    delayHtml = `<div class="delay-info late">+${delay} min opóźnienia</div>`;
                } else if (delay < 0) {
                    delayHtml = `<div class="delay-info on-time">${delay} min przed czasem</div>`;
                }

                return `
                    <div class="departure-row">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="badge">${line}</span>
                            <div>
                                <div style="font-weight: bold;">${headsign}</div>
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${time}</div>
                            ${delayHtml}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!cache.lines.length) {
        box.innerHTML = '<div class="loading">Brak danych o liniach.</div>';
        return;
    }

    box.innerHTML = cache.lines.map(l => {
        const id = l.id || l.name;
        const name = l.name || `Linia ${id}`;
        return `
            <div class="list-item" onclick="loadLineRoute('${id}', '${name}')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="badge">${id}</span>
                    <strong>${name}</strong>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">Pojazdy &rarr;</div>
            </div>
        `;
    }).join('');
}

function loadLineRoute(lineId, lineName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    
    const activeVehicles = cache.vehicles.filter(v => (v.lineLabel || v.line) === lineId);

    box.innerHTML = `
        <h2 style="margin-bottom: 4px; font-size: 1.1rem;">${lineName}</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Aktywne pojazdy na tej linii</p>
        <div>
            ${activeVehicles.length ? activeVehicles.map(v => {
                const delay = parseInt(v.delayInMinutes || 0, 10);
                return `
                    <div class="departure-row">
                        <div>
                            <strong>Pojazd #${v.id || 'N/A'}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Kierunek: ${v.headsign || '---'}</div>
                        </div>
                        <div class="time-box">
                            ${delay > 0 ? `<div class="delay-info late">+${delay} min opóźnienia</div>` : `<div class="delay-info on-time">O czasie</div>`}
                        </div>
                    </div>
                `;
            }).join('') : '<div class="loading">Brak pojazdów w ruchu dla tej linii.</div>'}
        </div>
    `;
}

function renderLive() {
    const box = document.getElementById('live-list');
    if (!cache.vehicles.length) {
        box.innerHTML = '<div class="loading">Brak danych GPS dla pojazdów.</div>';
        return;
    }

    box.innerHTML = cache.vehicles.map(v => {
        const line = v.lineLabel || v.line || '?';
        const delay = parseInt(v.delayInMinutes || 0, 10);

        return `
            <div class="departure-row">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="badge">${line}</span>
                    <div>
                        <div style="font-weight: bold;">Kierunek: ${v.headsign || 'Trasa miejska'}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Pojazd #${v.id}</div>
                    </div>
                </div>
                <div class="time-box">
                    ${delay > 0 ? `<div class="delay-info late">+${delay} min</div>` : `<div class="delay-info on-time">O czasie</div>`}
                </div>
            </div>
        `;
    }).join('');
}

init();
</script>
</body>
</html>
