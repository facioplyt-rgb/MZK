<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów Wlkp. - GTFS Static + API Live</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --gray-light: #f4f4f4;
            --gray-border: #b0b0b0;
            --gray-dark: #333333;
            --danger: #cc0000;
            --success: #006600;
            --info: #0044cc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.35; }

        header {
            background: var(--gray-dark);
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
        }

        .logo-title { font-weight: bold; font-size: 1rem; text-transform: uppercase; }
        .clock { font-size: 0.9rem; font-weight: bold; }

        nav {
            display: flex;
            background: var(--gray-light);
            border-bottom: 1px solid var(--gray-border);
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid var(--gray-border);
            padding: 10px 5px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            color: var(--gray-dark);
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; border-bottom: 2px solid #000; }

        .container { max-width: 750px; margin: 0 auto; padding: 10px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--gray-border);
            border-radius: 0;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #000; }

        .row-item {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .row-item:hover { background: var(--gray-light); }

        .badge {
            display: inline-block;
            border: 1px solid #000;
            padding: 2px 5px;
            font-weight: bold;
            font-size: 0.75rem;
            min-width: 30px;
            text-align: center;
            background: #fff;
            color: #000;
        }

        .back-btn {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }
        .back-btn:hover { background: #e0e0e0; }

        .dep-row {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-box { text-align: right; }
        .time-main { font-weight: bold; font-size: 1rem; }
        .countdown-info { font-size: 0.75rem; font-weight: bold; color: var(--info); }
        .delay-info { font-size: 0.65rem; font-weight: bold; }
        .delay-info.late { color: var(--danger); }
        .delay-info.on-time { color: var(--success); }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--gray-light);
            border-top: 1px solid var(--gray-border);
            padding: 5px 10px;
            font-size: 0.7rem;
            color: var(--gray-dark);
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .msg-box { text-align: center; padding: 20px; color: #555; }
    </style>
</head>
<body>

<header>
    <div class="logo-title">MZK Gorzów Wlkp. – GTFS + Live API</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('stops')">Przystanki</button>
    <button class="nav-btn" onclick="switchTab('lines')">Linie</button>
    <button class="nav-btn" onclick="switchTab('live')">GPS Na Żywo</button>
</nav>

<div class="container" style="padding-bottom: 40px;">
    <!-- PRZYSTANKI -->
    <section id="sec-stops" class="section active">
        <input type="text" id="stop-search" placeholder="Wpisz nazwę przystanku..." oninput="filterStops(this.value)">
        <div id="stops-list" class="msg-box">Ładowanie plików GTFS i bazy API...</div>
    </section>

    <!-- LINIE -->
    <section id="sec-lines" class="section">
        <div id="lines-list" class="msg-box">Pobieranie listy linii...</div>
    </section>

    <!-- POJAZDY GPS -->
    <section id="sec-live" class="section">
        <div id="live-list" class="msg-box">Pobieranie pozycji pojazdów...</div>
    </section>

    <!-- SZCZEGÓŁY ODJAZDÓW -->
    <section id="sec-details" class="section">
        <button class="back-btn" onclick="switchTab(window.appState.lastTab || 'stops')">&larr; Powrót</button>
        <div id="details-content"></div>
    </section>
</div>

<div class="status-bar">
    <span id="status-text">Inicjalizacja...</span>
    <span id="api-status">GTFS Engine v2.0</span>
</div>

<script>
const PROXY_URL = "https://shiny-tree-3a9b.fabianzukowski-32.workers.dev/"; 
const TOKEN = "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9";

window.appState = {
    stopsMap: new Map(),      // stop_id -> stop_name (z GTFS stops.txt)
    routesMap: new Map(),     // route_id -> route_short_name (z GTFS routes.txt)
    stopTimes: [],            // tablica obiektów z stop_times.txt
    tripsMap: new Map(),      // trip_id -> { route_id, trip_headsign, service_id }
    vehicles: [],             // pojazdy z API
    apiStops: [],             // przystanki z API
    lastTab: 'stops'
};

// Parser CSV dla plików GTFS
function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    if (lines.length < 2) return [];
    
    // Proste parsowanie nagłówków i wierszy z uwzględnieniem cudzysłowów
    const parseLine = (line) => {
        const result = [];
        let inQuotes = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(entry.trim());
                entry = '';
            } else {
                entry += char;
            }
        }
        result.push(entry.trim());
        return result;
    };

    const headers = parseLine(lines[0]);
    const data = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = parseLine(lines[i]);
        const obj = {};
        for (let j = 0; j < headers.length; j++) {
            obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].replace(/^"|"$/g, '') : '';
        }
        data.push(obj);
    }
    return data;
}

async function loadStaticGTFS() {
    try {
        // Ładowanie statycznych plików z folderu /gtfs/
        const [stopsRes, routesRes, tripsRes, stopTimesRes] = await Promise.all([
            fetch('./gtfs/stops.txt').catch(() => null),
            fetch('./gtfs/routes.txt').catch(() => null),
            fetch('./gtfs/trips.txt').catch(() => null),
            fetch('./gtfs/stop_times.txt').catch(() => null)
        ]);

        if (stopsRes && stopsRes.ok) {
            const rows = parseCSV(await stopsRes.text());
            rows.forEach(r => window.appState.stopsMap.set(r.stop_id, r.stop_name));
        }

        if (routesRes && routesRes.ok) {
            const rows = parseCSV(await routesRes.text());
            rows.forEach(r => window.appState.routesMap.set(r.route_id, r.route_short_name || r.route_long_name));
        }

        if (tripsRes && tripsRes.ok) {
            const rows = parseCSV(await tripsRes.text());
            rows.forEach(r => window.appState.tripsMap.set(r.trip_id, {
                route_id: r.route_id,
                trip_headsign: r.trip_headsign,
                service_id: r.service_id
            }));
        }

        if (stopTimesRes && stopTimesRes.ok) {
            window.appState.stopTimes = parseCSV(await stopTimesRes.text());
        }
        console.log("Załadowano pliki statyczne GTFS:", {
            stops: window.appState.stopsMap.size,
            routes: window.appState.routesMap.size,
            trips: window.appState.tripsMap.size,
            stopTimes: window.appState.stopTimes.length
        });
    } catch (e) {
        console.warn("Błąd wczytywania lokalnych plików GTFS:", e);
    }
}

async function fetchAPI(command, action, params = '') {
    const targetUrl = `https://komunikacja.um.gorzow.pl/vm/main?command=${command}&action=${action}&token=${TOKEN}${params}`;
    try {
        const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(targetUrl));
        if (!res.ok) return null;
        const text = await res.text();
        if (!text || text.trim().startsWith('<') || text.includes('Cloudflare')) return null;
        return JSON.parse(text);
    } catch (e) {
        console.error("Błąd API:", e);
        return null;
    }
}

async function initApp() {
    startClock();
    document.getElementById('status-text').innerText = 'Wczytywanie statycznego GTFS...';

    await loadStaticGTFS();

    document.getElementById('status-text').innerText = 'Pobieranie danych API na żywo...';
    const [stopsData, vehiclesData] = await Promise.all([
        fetchAPI('basicdata', 'locations'),
        fetchAPI('planner', 'v')
    ]);

    let rawStops = Array.isArray(stopsData) ? stopsData : (stopsData?.stops || stopsData?.locations || []);
    window.appState.apiStops = rawStops;
    window.appState.vehicles = Array.isArray(vehiclesData) ? vehiclesData : (vehiclesData?.vehicles || vehiclesData?.data || []);

    // Łączenie przystanków z API i GTFS
    const groupedMap = new Map();
    
    // Jeśli mamy zmapowane przystanki z GTFS, użyjmy ich nazw, lub oprzyjmy się na API
    rawStops.forEach(s => {
        let id = String(s.id || s.stopId || '');
        let name = window.appState.stopsMap.get(id) || s.name || s.title || 'Nieznany przystanek';
        name = name.replace(/\s*\(\d+\)\s*$/, '').trim();
        
        if (!groupedMap.has(name)) {
            groupedMap.set(name, { name: name, ids: [] });
        }
        if (id) groupedMap.get(name).ids.push(id);
    });

    // Jeśli GTFS stopsMap ma więcej przystanków niż API locations
    window.appState.stopsMap.forEach((gtfsName, gtfsId) => {
        let cleanName = gtfsName.replace(/\s*\(\d+\)\s*$/, '').trim();
        if (!groupedMap.has(cleanName)) {
            groupedMap.set(cleanName, { name: cleanName, ids: [gtfsId] });
        } else {
            if (!groupedMap.get(cleanName).ids.includes(gtfsId)) {
                groupedMap.get(cleanName).ids.push(gtfsId);
            }
        }
    });

    window.appState.stops = Array.from(groupedMap.values()).sort((a,b) => a.name.localeCompare(b.name));

    // Budowanie listy linii (z API oraz uzupełnienie z GTFS routes)
    const linesMap = new Map();
    window.appState.routesMap.forEach((rName, rId) => {
        linesMap.set(rId, { id: rId, name: `Linia ${rName}` });
    });
    window.appState.vehicles.forEach(v => {
        const lineNum = v.lineLabel || v.line || v.lineId || v.routeShortName;
        if (lineNum && !linesMap.has(String(lineNum))) {
            linesMap.set(String(lineNum), { id: lineNum, name: `Linia ${lineNum}` });
        }
    });
    window.appState.lines = Array.from(linesMap.values()).sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true}));

    renderStops();
    renderLines();
    renderLive();

    document.getElementById('status-text').innerText = 'Gotowy – Zsynchronizowano GTFS i API';
}

function getStopNameById(stopId) {
    if (window.appState.stopsMap.has(String(stopId))) {
        return window.appState.stopsMap.get(String(stopId));
    }
    const found = window.appState.apiStops.find(s => String(s.id) === String(stopId));
    return found ? (found.name || found.title) : `Przystanek #${stopId}`;
}

function getVehicleHeadsign(v) {
    let tripId = v.tripId || v.trip_id;
    if (tripId && window.appState.tripsMap.has(tripId)) {
        return window.appState.tripsMap.get(tripId).trip_headsign;
    }
    return v.headsign || v.direction || v.destination || v.to || 
           v.directionName || v.destName || v.tripHeadsign || 
           v.sign || v.text || v.description || v.tripName || 'Trasa miejska';
}

function getVehicleNextStop(v) {
    let stopId = v.nextStopId || v.stopId || v.currentStopId;
    if (stopId && window.appState.stopsMap.has(String(stopId))) {
        return window.appState.stopsMap.get(String(stopId));
    }
    return v.nextStopName || v.nextStop || v.stopName || v.currentStop || v.stop || 'Nieznany przystanek';
}

function getVehicleCountdown(v) {
    let sec = v.secToNextStop || v.timeToNextStop || v.secondsLeft || v.timeLeft;
    if (sec !== undefined && sec !== null) {
        return formatSeconds(parseInt(sec, 10));
    }
    let mins = v.minToNextStop || v.minutesLeft;
    if (mins !== undefined && mins !== null) {
        return `${mins} min`;
    }
    return null;
}

function formatSeconds(totalSecs) {
    if (isNaN(totalSecs)) return '';
    if (totalSecs < 0) return 'już odjeżdża';
    const mins = Math.floor(totalSecs / 60);
    const secs = totalSecs % 60;
    if (mins === 0) return `${secs} s`;
    return `${mins} min ${secs} s`;
}

function getTimeAndCountdown(timeStr) {
    if (!timeStr) return { time: '---', countdown: '' };
    const now = new Date();
    const [h, m] = timeStr.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return { time: timeStr, countdown: '' };

    const target = new Date();
    target.setHours(h, m, 0, 0);

    let diffSec = Math.floor((target - now) / 1000);
    if (diffSec < -30) {
        target.setDate(target.getDate() + 1);
        diffSec = Math.floor((target - now) / 1000);
    }

    return {
        time: timeStr,
        countdown: formatSeconds(diffSec)
    };
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function switchTab(tab) {
    if (tab !== 'details') window.appState.lastTab = tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetSec = document.getElementById(`sec-${tab}`);
    if (targetSec) targetSec.classList.add('active');

    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
    }
}

function renderStops() {
    filterStops('');
}

function filterStops(query) {
    const box = document.getElementById('stops-list');
    if (!window.appState.stops.length) {
        box.innerHTML = '<div class="msg-box">Brak danych przystanków. Sprawdź plik stops.txt w folderze /gtfs/.</div>';
        return;
    }

    const filtered = window.appState.stops
        .filter(s => s.name.toLowerCase().includes(query.toLowerCase()));

    if (!filtered.length) {
        box.innerHTML = '<div class="msg-box">Nie znaleziono przystanku.</div>';
        return;
    }

    box.innerHTML = filtered.map(s => `
        <div class="row-item" onclick='loadGroupedDepartures(${JSON.stringify(s.ids)}, ${JSON.stringify(s.name)})'>
            <div><strong>${s.name}</strong></div>
            <div style="font-size: 0.75rem; color: #555;">odjazdy &rarr;</div>
        </div>
    `).join('');
}

async function loadGroupedDepartures(stopIds, stopName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    box.innerHTML = `<div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px;">${stopName}</div><div class="msg-box">Kalkulacja czasu z rozkładu GTFS i API...</div>`;

    let allDepartures = [];
    
    // Pobranie danych dynamicznych z API dla przystanków
    for (const id of stopIds) {
        const data = await fetchAPI('planner', 'b', `&stopId=${id}`);
        const deps = Array.isArray(data) ? data : (data?.departures || []);
        allDepartures.push(...deps);
    }

    // Uzupełnienie lub weryfikacja z statycznego stop_times.txt jeśli API zawiedzie lub jako cross-reference
    if (!allDepartures.length && window.appState.stopTimes.length > 0) {
        const now = new Date();
        const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        
        stopIds.forEach(id => {
            const matches = window.appState.stopTimes.filter(st => st.stop_id === String(id));
            matches.forEach(st => {
                const [h, m, s] = st.arrival_time.split(':').map(Number);
                const arrSec = h * 3600 + m * 60 + (s || 0);
                if (arrSec >= currentSeconds && arrSec <= currentSeconds + 7200) {
                    let trip = window.appState.tripsMap.get(st.trip_id);
                    let routeName = trip ? window.appState.routesMap.get(trip.route_id) : 'MZK';
                    allDepartures.push({
                        line: routeName || 'MZK',
                        headsign: trip ? trip.trip_headsign : 'Kierunek miejski',
                        time: st.arrival_time.substring(0, 5),
                        delayInMinutes: 0,
                        source: 'GTFS Static'
                    });
                }
            });
        });
    }

    allDepartures.sort((a, b) => {
        const timeA = a.time || a.actualTime || "00:00";
        const timeB = b.time || b.actualTime || "00:00";
        return timeA.localeCompare(timeB);
    });

    if (!allDepartures.length) {
        box.innerHTML = `<div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${stopName}</div><div class="msg-box">Brak odjazdów dla tego przystanku.</div>`;
        return;
    }

    box.innerHTML = `
        <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${stopName}</div>
        <div style="font-size: 0.75rem; color: #555; margin-bottom: 8px;">Weryfikacja opóźnień (GTFS vs Live API):</div>
        <div>
            ${allDepartures.map(d => {
                const line = d.line || d.lineLabel || 'MZK';
                const headsign = d.headsign || d.direction || d.destination || d.to || 'Kierunek miejski';
                const rawTime = d.time || d.actualTime || '---';
                const timeInfo = getTimeAndCountdown(rawTime);
                const delay = parseInt(d.delayInMinutes || 0, 10);

                let delayHtml = `<div class="delay-info on-time">O czasie (Zgodne z GTFS)</div>`;
                if (delay > 0) {
                    delayHtml = `<div class="delay-info late">+${delay} min opóźnienia</div>`;
                } else if (delay < 0) {
                    delayHtml = `<div class="delay-info on-time">${Math.abs(delay)} min przed czasem</div>`;
                }

                return `
                    <div class="dep-row">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="badge">${line}</span>
                            <div>
                                <strong>${headsign}</strong>
                                <div class="countdown-info">za ${timeInfo.countdown}</div>
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${timeInfo.time}</div>
                            ${delayHtml}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!window.appState.lines.length) {
        box.innerHTML = '<div class="msg-box">Brak linii w bazie.</div>';
        return;
    }

    box.innerHTML = window.appState.lines.map(l => {
        return `
            <div class="row-item" onclick="loadLineRoute('${l.id}', '${l.name}')">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="badge">${l.id}</span>
                    <strong>${l.name}</strong>
                </div>
                <div style="font-size: 0.75rem; color: #555;">pojazdy &rarr;</div>
            </div>
        `;
    }).join('');
}

function loadLineRoute(lineId, lineName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    const activeVehicles = window.appState.vehicles.filter(v => {
        const vLine = String(v.lineLabel || v.line || v.lineId || v.routeShortName);
        return vLine === String(lineId);
    });

    box.innerHTML = `
        <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 4px;">${lineName}</div>
        <div style="font-size: 0.75rem; color: #555; margin-bottom: 8px;">Pojazdy na linii (powiązane z GTFS):</div>
        <div>
            ${activeVehicles.length ? activeVehicles.map(v => {
                const headsign = getVehicleHeadsign(v);
                const nextStop = getVehicleNextStop(v);
                const countdown = getVehicleCountdown(v);
                const delay = parseInt(v.delayInMinutes || 0, 10);
                return `
                    <div class="dep-row">
                        <div>
                            <strong>Pojazd #${v.id || 'N/A'}</strong>
                            <div style="font-size: 0.75rem;">Kierunek: ${headsign}</div>
                            <div style="font-size: 0.75rem; color: #333;">Najbliższy przystanek: <strong>${nextStop}</strong> ${countdown ? `(<span style="color:var(--info)">za ${countdown}</span>)` : ''}</div>
                        </div>
                        <div class="time-box">
                            ${delay > 0 ? `<div class="delay-info late">+${delay} min opóźnienia</div>` : `<div class="delay-info on-time">O czasie</div>`}
                        </div>
                    </div>
                `;
            }).join('') : '<div class="msg-box">Brak aktywnych pojazdów na tej linii.</div>'}
        </div>
    `;
}

function renderLive() {
    const box = document.getElementById('live-list');
    if (!window.appState.vehicles.length) {
        box.innerHTML = '<div class="msg-box">Brak danych GPS dla pojazdów.</div>';
        return;
    }

    box.innerHTML = window.appState.vehicles.map(v => {
        const line = v.lineLabel || v.line || v.lineId || v.routeShortName || '?';
        const headsign = getVehicleHeadsign(v);
        const nextStop = getVehicleNextStop(v);
        const countdown = getVehicleCountdown(v);
        const delay = parseInt(v.delayInMinutes || 0, 10);

        return `
            <div class="dep-row">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="badge">${line}</span>
                    <div>
                        <strong>Kierunek: ${headsign}</strong>
                        <div style="font-size: 0.75rem; color: #333;">Przystanek: <strong>${nextStop}</strong> ${countdown ? `(<span style="color:var(--info)">za ${countdown}</span>)` : ''}</div>
                        <div style="font-size: 0.7rem; color: #555;">Pojazd #${v.id}</div>
                    </div>
                </div>
                <div class="time-box">
                    ${delay > 0 ? `<div class="delay-info late">+${delay} min</div>` : `<div class="delay-info on-time">O czasie</div>`}
                </div>
            </div>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
