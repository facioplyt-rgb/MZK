
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03060b">
    <title>MZK Gorzów</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --accent: #00d166; --bg: #03060b; --surf: #0d121d; --surf-l: #161d2b; 
            --text: #ffffff; --text-m: #94a3b8; --tram: #ff4757; --bus: #00a8ff; 
            --warn: #f1c40f; --border: rgba(255,255,255,0.08); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 30px; }
        
        #sync-status { position: fixed; bottom: 0; left: 0; width: 100%; padding: 8px 15px; font-size: 0.72rem; background: var(--surf); border-top: 1px solid var(--border); display: flex; justify-content: space-between; z-index: 5000; color: var(--text-m); font-weight: 600; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(3,6,11,0.92); backdrop-filter: blur(12px); z-index: 2000; }
        
        .side-menu { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--surf); z-index: 4000; transition: 0.3s ease; padding: 25px; border-right: 1px solid var(--border); }
        .side-menu.open { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 3000; display: none; backdrop-filter: blur(4px); }
        .overlay.show { display: block; }

        .container { max-width: 650px; margin: 0 auto; padding: 15px; }
        .card { background: var(--surf); border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }
        .module { display: none; }
        .module.active { display: block; animation: fadeIn 0.2s ease-out; }
        
        #toast-container { position: fixed; top: 15px; right: 15px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 18px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 0.85rem; animation: slideIn 0.25s forwards; box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px; }
        .toast.success { background: var(--accent); color: #000; }
        .toast.error { background: var(--tram); color: #fff; }
        
        .delay-tag { font-size: 0.7rem; font-weight: 900; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
        .delay-tag.on-time { background: rgba(0, 209, 102, 0.15); color: var(--accent); }
        .delay-tag.delayed { background: rgba(255, 71, 87, 0.15); color: var(--tram); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        input, select { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surf-l); border: 1px solid var(--border); color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #000; padding: 13px; border: none; border-radius: 10px; width: 100%; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-sm { padding: 8px 12px; font-size: 0.78rem; width: auto; background: var(--surf-l); color: #fff; border: 1px solid var(--border); border-radius: 8px; }

        .nav-item { padding: 12px; display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; border-radius: 10px; margin-bottom: 4px; }
        .nav-item:hover { background: var(--surf-l); color: var(--accent); }
        
        .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 900; }
        .dep-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--surf-l); border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
        .news-card { border-left: 4px solid var(--warn); background: var(--surf); padding: 14px; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="sync-status">
    <span><span id="status-dot" class="status-dot" style="background: #f1c40f;"></span> <span id="status-text">Inicjalizacja...</span></span>
    <span>GORZÓW LIVE</span>
</div>

<div class="overlay" id="overlay" onclick="App.toggleMenu(false)"></div>

<div class="side-menu" id="side-menu">
    <h2 style="font-weight: 900; margin-bottom: 25px;">MZK <span style="color:var(--accent)">GORZÓW</span></h2>
    <div class="nav-item" onclick="App.gate('vehicles')"><i class="fa-solid fa-bus"></i> Pojazdy Na Żywo</div>
    <div class="nav-item" onclick="App.gate('lines')"><i class="fa-solid fa-route"></i> Linie i Trasy</div>
    <div class="nav-item" onclick="App.gate('stops')"><i class="fa-solid fa-location-dot"></i> Wyszukiwarka Przystanków</div>
    <div class="nav-item" onclick="App.gate('news')"><i class="fa-solid fa-newspaper"></i> Ogłoszenia MZK</div>
    <div class="nav-item" onclick="App.gate('alerts')"><i class="fa-solid fa-bullhorn"></i> Zgłoszenia Pasażerów</div>
</div>

<header>
    <div onclick="App.toggleMenu(true)" style="font-size: 1.3rem; cursor: pointer; color: var(--accent);"><i class="fa-solid fa-bars-staggered"></i></div>
    <div style="font-weight: 900; letter-spacing: 0.5px; color: var(--accent);">MZK GORZÓW HQ</div>
    <div id="live-clock" style="font-weight: 700; font-size: 0.8rem; background: var(--surf-l); padding: 4px 8px; border-radius: 6px;">00:00:00</div>
</header>

<div class="container">
    <section id="mod-vehicles" class="module active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2 style="font-weight: 900; font-size: 1.2rem;">POJAZDY GPS LIVE</h2>
            <button class="btn btn-sm" onclick="ModVehicles.load()"><i class="fa-solid fa-rotate"></i> Odśwież</button>
        </div>
        <div id="vehicles-list"></div>
    </section>

    <section id="mod-lines" class="module">
        <h2 style="margin-bottom:12px; font-weight: 900; font-size: 1.2rem;">LINIE I ROZKŁADY</h2>
        <div id="lines-list"></div>
    </section>

    <section id="mod-stops" class="module">
        <h2 style="margin-bottom:12px; font-weight: 900; font-size: 1.2rem;">PRZYSTANKI</h2>
        <input type="text" id="stop-search" placeholder="Szukaj przystanku..." oninput="ModStops.filter(this.value)">
        <div id="stops-list"></div>
    </section>

    <section id="mod-news" class="module">
        <h2 style="margin-bottom:12px; font-weight: 900; font-size: 1.2rem;">OFICJALNE KOMUNIKATY</h2>
        <div id="news-list"></div>
    </section>

    <section id="mod-alerts" class="module">
        <h2 style="margin-bottom:12px; font-weight: 900; font-size: 1.2rem;">ZGŁOSZENIA PASAŻERÓW</h2>
        <button class="btn" style="margin-bottom:12px;" onclick="ModAlerts.openForm()"><i class="fa-solid fa-plus"></i> Dodaj wpis</button>
        <div id="alerts-list"></div>
    </section>

    <section id="mod-details" class="module"></section>
</div>

<script>
const CONFIG = {
    UM_API: "https://komunikacja.um.gorzow.pl/vm/main?command=planner",
    MZK_NEWS: "https://mzk-gorzow.pl/index.php?option=com_content&view=category&id=2&format=json",
    TOKEN: "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9"
};

// Zoptymalizowana funkcja z bezpośrenim połączeniem, przekazywaniem tokenu w URL i limitem czasu
async function fetchSafeJSON(url, headers = {}) {
    let targetUrl = url;
    if (CONFIG.TOKEN && !targetUrl.includes('token=')) {
        targetUrl += (targetUrl.includes('?') ? '&' : '?') + `token=${CONFIG.TOKEN}`;
    }

    // 1. Próba bezpośredniego połączenia (najszybsza i bez strat nagłówków)
    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3000);
        const res = await fetch(targetUrl, { headers, signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
            const text = await res.text();
            return JSON.parse(text);
        }
    } catch (e) {
        // Ignorujemy błąd CORS/sieci i przechodzimy do proxy
    }

    // 2. Próba przez darmowe bramki proxy z automatycznym timeoutem (max 3.5s na próbowaną bramkę)
    const proxies = [
        u => `https://thingproxy.freeboard.io/fetch/${u}`,
        u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
        u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];

    for (const proxyFn of proxies) {
        try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 3500);
            const res = await fetch(proxyFn(targetUrl), { signal: controller.signal });
            clearTimeout(timer);

            if (!res.ok) continue;
            const text = await res.text();
            return JSON.parse(text);
        } catch (e) {
            // Przejdź do kolejnego proxy w przypadku powolnej odpowiedzi/błędu
        }
    }
    return null;
}

const App = {
    dbKey: 'mzk_gorzow_live_alerts',
    cache: { vehicles: [], lines: [], stops: [], news: [] },

    async init() {
        this.startClock();
        this.setupFirebase();
        await this.loadAllAPIData();
    },

    setupFirebase() {
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDAp3b1eLuZdus48M5aE9N9TTzPhFRU4i0",
                authDomain: "mzkfacio.firebaseapp.com",
                databaseURL: "https://mzkfacio-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "mzkfacio"
            };
            if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            this.db = firebase.database();
            
            this.db.ref(this.dbKey).on('value', snap => {
                const val = snap.val() || {};
                ModAlerts.render(val);
                localStorage.setItem(this.dbKey, JSON.stringify(val));
            }, () => this.fallbackLocalAlerts());
        } catch (e) {
            this.fallbackLocalAlerts();
        }
    },

    fallbackLocalAlerts() {
        const localData = JSON.parse(localStorage.getItem(this.dbKey) || '{}');
        ModAlerts.render(localData);
    },

    async loadAllAPIData() {
        this.status("Pobieranie danych z API Gorzowa...", "#f1c40f");

        const [vData, lData, pData, nData] = await Promise.all([
            fetchSafeJSON(`${CONFIG.UM_API}&action=v`),
            fetchSafeJSON(`${CONFIG.UM_API}&action=l`),
            fetchSafeJSON(`${CONFIG.UM_API}&action=p`),
            fetchSafeJSON(CONFIG.MZK_NEWS)
        ]);

        this.cache.vehicles = Array.isArray(vData) ? vData : (vData?.vehicles || []);
        this.cache.lines = Array.isArray(lData) ? lData : (lData?.lines || []);
        this.cache.stops = Array.isArray(pData) ? pData : (pData?.stops || []);
        this.cache.news = Array.isArray(nData) ? nData : (nData?.items || []);

        ModVehicles.render();
        ModLines.render();
        ModStops.render();
        ModNews.render();

        if(this.cache.vehicles.length || this.cache.stops.length) {
            this.status("Połączono z API Gorzów", "#00d166");
            this.toast("Zaktualizowano dane z systemu MZK!");
        } else {
            this.status("Tryb offline / Dane archiwalne", "#f1c40f");
        }
    },

    startClock() {
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('pl-PL');
        }, 1000);
    },

    status(txt, col) {
        document.getElementById('status-text').innerText = txt;
        document.getElementById('status-dot').style.background = col;
    },

    toast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i> ${msg}`;
        container.appendChild(el);
        setTimeout(() => { el.remove(); }, 3000);
    },

    toggleMenu(open) {
        document.getElementById('side-menu').classList.toggle('open', open);
        document.getElementById('overlay').classList.toggle('show', open);
    },

    gate(id) {
        document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
        const target = document.getElementById('mod-' + id) || document.getElementById('mod-vehicles');
        target.classList.add('active');
        this.toggleMenu(false);
        window.scrollTo(0,0);
    }
};

const ModVehicles = {
    async load() {
        App.status("Odświeżanie pozycji GPS...", "#f1c40f");
        const data = await fetchSafeJSON(`${CONFIG.UM_API}&action=v`);
        if(data) {
            App.cache.vehicles = Array.isArray(data) ? data : (data.vehicles || []);
            this.render();
            App.status("Połączono z API Gorzów", "#00d166");
            App.toast("Pojazdy zaktualizowane");
        } else {
            App.toast("Nie udało się pobrać pozycji GPS", "error");
        }
    },

    render() {
        const box = document.getElementById('vehicles-list');
        box.innerHTML = '';

        if (!App.cache.vehicles.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Brak pojazdów na trasie lub przerwa w transmisji GPS.</div>';
            return;
        }

        App.cache.vehicles.forEach(v => {
            const isTram = v.linetype === "0" || v.type === "tram" || (v.lineLabel && v.lineLabel.length === 1);
            const lineLabel = v.lineLabel || v.label || v.line || "N/A";
            const delay = parseInt(v.delayInMinutes || 0, 10);
            
            const lat = v.lat ? parseFloat(v.lat).toFixed(3) : '---';
            const lon = v.lon ? parseFloat(v.lon).toFixed(3) : '---';

            let delayTag = delay > 0 
                ? `<span class="delay-tag delayed">+${delay} min</span>`
                : `<span class="delay-tag on-time">O czasie</span>`;

            box.innerHTML += `
                <div class="card" style="border-left: 4px solid ${isTram ? 'var(--tram)' : 'var(--bus)'}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <div>
                            <span class="badge" style="background:${isTram ? 'var(--tram)' : 'var(--bus)'}; color:#fff;">${lineLabel}</span>
                            <b style="margin-left:6px;">Pojazd #${v.id || 'LIVE'}</b>
                        </div>
                        ${delayTag}
                    </div>
                    <div style="font-size:0.8rem; opacity:0.8; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-compass"></i> ${v.headsign || 'Kierunek miejski'}</span>
                        <span style="font-family:monospace; color:var(--accent);">${lat}, ${lon}</span>
                    </div>
                </div>`;
        });
    }
};

const ModLines = {
    render() {
        const box = document.getElementById('lines-list');
        box.innerHTML = '';

        let lines = App.cache.lines;
        if (!lines.length && App.cache.vehicles.length) {
            const extracted = [...new Set(App.cache.vehicles.map(v => v.lineLabel || v.line))].filter(Boolean);
            lines = extracted.map(id => ({ id, name: `Linia ${id}` }));
        }

        if (!lines.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Brak danych o liniach.</div>';
            return;
        }

        lines.forEach(l => {
            const lineId = l.id || l.name;
            box.innerHTML += `
                <div class="card" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="ModLines.showDetails('${lineId}')">
                    <div>
                        <span class="badge" style="background:var(--accent); color:#000; font-size:0.85rem; margin-right:8px;">${lineId}</span>
                        <b>${l.name || 'Linia ' + lineId}</b>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="opacity:0.4;"></i>
                </div>`;
        });
    },

    showDetails(lineId) {
        App.gate('details');
        const activeVehicles = App.cache.vehicles.filter(v => (v.lineLabel || v.line) === lineId);

        let activeHtml = activeVehicles.map(v => `
            <div class="dep-item">
                <div><b>Pojazd #${v.id || 'LIVE'}</b> → ${v.headsign || 'W trasie'}</div>
                <div style="color:var(--accent); font-weight:bold;">${v.delayInMinutes ? '+' + v.delayInMinutes + ' min' : 'O czasie'}</div>
            </div>
        `).join('') || '<p style="opacity:0.5; font-size:0.85rem; padding:10px;">Brak aktywnych pojazdów na tej linii.</p>';

        document.getElementById('mod-details').innerHTML = `
            <button class="btn btn-sm" onclick="App.gate('lines')" style="margin-bottom:12px;"><i class="fa-solid fa-arrow-left"></i> POWRÓT</button>
            <div class="card">
                <h1 style="font-size:2rem; color:var(--accent); margin-bottom:5px;">Linia ${lineId}</h1>
                <p style="opacity:0.6; margin-bottom:15px;">Monitorowane pojazdy na trasie:</p>
                ${activeHtml}
            </div>`;
    }
};

const ModStops = {
    render() {
        this.filter('');
    },

    filter(query) {
        const box = document.getElementById('stops-list');
        box.innerHTML = '';
        
        let stops = App.cache.stops;
        if (!stops.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.6;">Ładowanie przystanków...</div>';
            return;
        }

        const filtered = stops.filter(s => (s.name || s.title || '').toLowerCase().includes(query.toLowerCase())).slice(0, 25);

        filtered.forEach(s => {
            box.innerHTML += `
                <div class="card" style="cursor:pointer;" onclick="ModStops.showDepartures('${s.id}', '${s.name || s.title}')">
                    <i class="fa-solid fa-location-dot" style="color:var(--accent); margin-right:8px;"></i>
                    <b>${s.name || s.title}</b>
                </div>`;
        });
    },

    async showDepartures(stopId, stopName) {
        App.gate('details');
        document.getElementById('mod-details').innerHTML = '<div class="card">Ładowanie odjazdów...</div>';

        const deps = await fetchSafeJSON(`${CONFIG.UM_API}&action=b&stopId=${stopId}`);
        const depList = Array.isArray(deps) ? deps : (deps?.departures || []);

        let listHtml = depList.map(d => `
            <div class="dep-item">
                <div>
                    <span class="badge" style="background:var(--accent); color:#000;">${d.line || d.lineLabel || 'MZK'}</span>
                    <b style="margin-left:8px;">${d.headsign || d.direction || 'Kierunek Miejscki'}</b>
                </div>
                <div style="font-weight:900; color:var(--accent);">${d.time || d.actualTime || 'Za chwilę'}</div>
            </div>
        `).join('') || '<p style="opacity:0.5; padding:10px;">Brak zaplanowanych odjazdów w najbliższym czasie.</p>';

        document.getElementById('mod-details').innerHTML = `
            <button class="btn btn-sm" onclick="App.gate('stops')" style="margin-bottom:12px;"><i class="fa-solid fa-arrow-left"></i> POWRÓT</button>
            <div class="card">
                <h2 style="color:var(--accent); margin-bottom:5px;">${stopName}</h2>
                <p style="opacity:0.5; margin-bottom:15px; font-size:0.85rem;">Tablica odjazdów na żywo:</p>
                ${listHtml}
            </div>`;
    }
};

const ModNews = {
    render() {
        const box = document.getElementById('news-list');
        box.innerHTML = '';

        if (!App.cache.news.length) {
            box.innerHTML = `
                <div class="news-card">
                    <b>Komunikaty i Zmiany Rozkładów MZK Gorzów</b>
                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">Bieżące informacje o objazdach oraz zmianach w kursowaniu tramwajów i autobusów są synchronizowane z oficjalnym serwisem MZK.</p>
                </div>`;
            return;
        }

        App.cache.news.forEach(n => {
            box.innerHTML += `
                <div class="news-card">
                    <b>${n.title || 'Informacja MZK'}</b>
                    <p style="font-size:0.85rem; opacity:0.8; margin-top:5px;">${n.introtext || n.description || ''}</p>
                </div>`;
        });
    }
};

const ModAlerts = {
    render(data) {
        const box = document.getElementById('alerts-list');
        box.innerHTML = '';
        const items = Object.values(data || {}).reverse();

        if(!items.length) {
            box.innerHTML = '<div class="card" style="text-align:center; opacity:0.5;">Brak opublikowanych zgłoszeń.</div>';
            return;
        }

        items.forEach(a => {
            box.innerHTML += `
                <div class="card" style="border-left:4px solid var(--warn);">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <b>${a.type} - Linia ${a.line}</b>
                        <small style="opacity:0.5;">${new Date(a.time).toLocaleTimeString('pl-PL')}</small>
                    </div>
                    <p style="font-size:0.85rem; opacity:0.8;">${a.desc}</p>
                </div>`;
        });
    },

    openForm() {
        document.getElementById('mod-details').innerHTML = `
            <button class="btn btn-sm" onclick="App.gate('alerts')" style="margin-bottom:12px;"><i class="fa-solid fa-arrow-left"></i> ANULUJ</button>
            <div class="card">
                <h3 style="margin-bottom:12px;">NOWE ZGŁOSZENIE</h3>
                <input id="a-line" placeholder="Numer linii (np. 1, 124)">
                <select id="a-type">
                    <option value="AWARIA">Awaria / Utrudnienie</option>
                    <option value="KANAR">Kontrola biletów</option>
                    <option value="OPÓŹNIENIE">Duże opóźnienie</option>
                </select>
                <input id="a-desc" placeholder="Opis sytuacji / lokalizacja...">
                <button class="btn" onclick="ModAlerts.save()">WYŚLIJ ZGŁOSZENIE</button>
            </div>`;
        App.gate('details');
    },

    save() {
        const line = document.getElementById('a-line').value.trim();
        const type = document.getElementById('a-type').value;
        const desc = document.getElementById('a-desc').value.trim();

        if(!line || !desc) return App.toast("Wypełnij pole linii i opisu!", "error");

        const newItem = { line, type, desc, time: Date.now() };

        if(App.db) {
            App.db.ref(App.dbKey).push(newItem).then(() => {
                App.toast("Dodano zgłoszenie!");
                App.gate('alerts');
            }).catch(() => this.saveLocally(newItem));
        } else {
            this.saveLocally(newItem);
        }
    },

    saveLocally(item) {
        const local = JSON.parse(localStorage.getItem(App.dbKey) || '{}');
        local[Date.now()] = item;
        localStorage.setItem(App.dbKey, JSON.stringify(local));
        this.render(local);
        App.toast("Zapisano lokalnie!");
        App.gate('alerts');
    }
};

App.init();
</script>
</body>
</html>
